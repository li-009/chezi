<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RemoteOps Industrial</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",      /* Cyber Blue */
                        "primary-hover": "#2563eb",
                        "secondary": "#06b6d4",    /* Neon Cyan */
                        "accent": "#f97316",       /* Unsafe Orange */
                        "background-dark": "#0f172a", /* Deep Slate */
                        "surface-dark": "rgba(30, 41, 59, 0.7)", /* Glass Slate */
                        "card-dark": "rgba(30, 41, 59, 0.4)",
                        "border-light": "rgba(255, 255, 255, 0.08)",
                        "text-main": "#f8fafc",
                        "text-muted": "#94a3b8"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "Noto Sans SC", "sans-serif"],
                        "body": ["Noto Sans SC", "sans-serif"],
                        "mono": ["Fira Code", "monospace"]
                    },
                    backgroundImage: {
                        'cyber-grid': "radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%), linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px)"
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08), transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05), transparent 25%);
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        /* Neon Glows */
        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .glow-border:focus-within {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.5);
        }

        /* Scanline Effect */
        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* HUD Markers */
        .hud-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid rgba(59, 130, 246, 0.5);
            transition: all 0.3s ease;
        }

        .hud-tl {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }

        .hud-tr {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }

        .hud-bl {
            bottom: 0;
            left: 0;
            border-right: none;
            border-top: none;
        }

        .hud-br {
            bottom: 0;
            right: 0;
            border-left: none;
            border-top: none;
        }

        .group:hover .hud-corner {
            border-color: #3b82f6;
            width: 12px;
            height: 12px;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulse-soft {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .animate-pulse-soft {
            animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Cyber Grid Background Utility */
        .bg-cyber {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
